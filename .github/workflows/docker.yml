name: Build, Push and Deploy Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/linkedin-backend:latest ./server

      - name: Build Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/linkedin-client:latest ./client

      - name: Push Backend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/linkedin-backend:latest

      - name: Push Frontend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/linkedin-client:latest


  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Update Backend Image
        run: |
          kubectl set image deployment/linkedin-backend \
          backend=${{ secrets.DOCKER_USERNAME }}/linkedin-backend:latest \
          -n linkedin

      - name: Update Frontend Image
        run: |
          kubectl set image deployment/linkedin-frontend \
          frontend=${{ secrets.DOCKER_USERNAME }}/linkedin-client:latest \
          -n linkedin

      - name: Restart Backend
        run: |
          kubectl rollout restart deployment/linkedin-backend -n linkedin

      - name: Restart Frontend
        run: |
          kubectl rollout restart deployment/linkedin-frontend -n linkedin

      - name: Check Backend Deployment
        run: |
          kubectl rollout status deployment/linkedin-backend \
          -n linkedin \
          --timeout=180s

      - name: Check Frontend Deployment
        run: |
          kubectl rollout status deployment/linkedin-frontend \
          -n linkedin \
          --timeout=180s

      - name: Check Pods
        run: |
          kubectl get pods -n linkedin